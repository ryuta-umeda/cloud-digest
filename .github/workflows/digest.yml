name: digest

on:
  schedule:
    # Weekdays 04:17 JST. Not on the hour: top-of-hour runs are the ones GitHub delays or drops.
    # Early on purpose: a run was delayed ~3h (08:17 -> 11:26 on 2026-10-12) and missed the
    # 09:00 / 10:00 Power Automate pickups, so the delay needs headroom before 09:00.
    - cron: "17 4 * * 1-5"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
      - name: Build digest
        id: build
        run: python -m digest.main
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FEED_URL: ${{ vars.FEED_URL }}
          FEED_URL_VULN: ${{ vars.FEED_URL_VULN }}
      # Committed even on a day with no new articles: seen.json's last_run changes, and the
      # repository activity keeps GitHub from auto-disabling the schedule after 60 days.
      # always(): when one profile fails, the other one's result is still published.
      - name: Publish
        if: ${{ always() && steps.build.conclusion != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in digest.xml seen.json entries.json digest-vuln.xml seen-vuln.json entries-vuln.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "chore: update digest $(date -u +%F)"
          git push
